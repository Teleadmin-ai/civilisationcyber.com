name: Generate PDF

on:
  push:
    paths:
      - 'paper.html'
      - 'generate-pdf.js'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Generate PDF
        run: node generate-pdf.js

      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/docs/R-JEPA_Cybernetics_Paper.pdf
          git diff --staged --quiet || git commit -m "chore: Auto-regenerate PDF from paper.html"
          git push
